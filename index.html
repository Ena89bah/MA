<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b2029" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="دليل الشركات">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📇</text></svg>">
  <title>Companies &amp; Tasks Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=34">
</head>
<body>
  <header class="topbar">
    <div class="brand">📇 <span data-i18n>دليل الشركات والمهام</span></div>
    <nav class="tabs">
      <button data-view="directory" class="active" data-i18n>البراندات</button>
      <button data-view="tasks" data-i18n>المهام</button>
      <button data-view="rentals" data-i18n>طلبات التأجير</button>
      <button data-view="emails" data-i18n>استخراج الإيميلات</button>
      <button data-view="phones" data-i18n>استخراج الأرقام</button>
      <button data-view="employees" data-i18n>الموظفين</button>
      <button data-view="sources" data-i18n>مصادر البيانات</button>
      <button data-view="settings" data-i18n>البيانات</button>
    </nav>
    <span id="syncStatus" class="sync"></span>
    <span id="userBox" class="user-box" hidden></span>
    <button id="logoutBtn" class="btn sm" data-action="logout" hidden data-i18n>تسجيل الخروج</button>
    <button id="langBtn" class="btn sm lang-btn" data-action="toggle-lang" lang="en">English</button>
  </header>

  <main id="app"><p class="empty" data-i18n>جاري التحميل…</p></main>

  <dialog id="modal">
    <form id="modalForm" method="dialog"></form>
  </dialog>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=34"></script>
  <script src="db.js?v=34"></script>
  <script src="i18n.js?v=34"></script>
  <script src="app.js?v=34"></script>
</body>
</html>
