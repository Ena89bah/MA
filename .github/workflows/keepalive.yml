# يتصل بقاعدة البيانات يومياً ويحدّث تاريخ آخر نشاط، حتى لا يتوقف مشروع Supabase المجاني.
# يمكن تشغيله يدوياً من GitHub: Actions > Supabase keep-alive > Run workflow
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * *" # يومياً 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update last-activity date
        env:
          # القيم العامة نفسها الموجودة في config.js. المفتاح العام مخصص للاستخدام المكشوف
          SUPABASE_URL: https://egajrjptkrjmokuqlvqo.supabase.co
          SUPABASE_KEY: sb_publishable_jVlVOIT5EF9wSeZPLIrs2Q_e5GDcpWZ
        run: |
          curl --fail-with-body --silent --show-error --max-time 60 --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/app_keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
